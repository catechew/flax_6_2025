<div class="dropdown">
  <button class="btn btn-outline-{{ style }} btn-sm dropdown-toggle"
          data-bs-toggle="dropdown"
          data-bs-auto-close="outside">
    {{ label }}
    {% if selected %}
      ({{ selected|length }})
    {% endif %}
  </button>

  <div class="dropdown-menu p-2">
    {% for option in options %}
      <div class="form-check">
        <input class="form-check-input"
               type="checkbox"
               name="{{ name }}"
               value="{{ option }}"
               id="{{ name }}_{{ forloop.counter }}"
               {% if option in selected %}checked{% endif %}>
        <label class="form-check-label"
               for="{{ name }}_{{ forloop.counter }}">
          {{ option|title }}
        </label>
      </div>
    {% endfor %}
  </div>
</div>
