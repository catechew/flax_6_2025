{% if slot %}

    {% if slot.recipe %}
        <!-- Show recipe name -->
        <div class="mb-1">
            <a href="{% url 'recipe_detail' slot.recipe.id %}" 
               class="fw-bold text-primary text-decoration-none">
                {{ slot.recipe.title }}
            </a>
        </div>

        <!-- Edit button -->
        <a href="{% url 'meal-slot-update' slot.id %}" 
           class="btn btn-sm btn-outline-primary me-1">
            ✏️ Edit
        </a>

        <!-- Clear button -->
        <a href="{% url 'meal-slot-clear' slot.id %}" 
           class="btn btn-sm btn-outline-danger">
            🗑 Clear
        </a>

    {% else %}
        <!-- Empty slot UI -->
        <a href="{% url 'meal-slot-update' slot.id %}"
           class="btn btn-sm btn-outline-secondary">
            ➕ Add
        </a>
    {% endif %}

{% else %}
    <span class="text-danger">No slot found</span>
{% endif %}
