{% if slot %}
    {% if slot.recipe %}
        <div class="slot-content">
            <a href="{% url 'recipe_detail' slot.recipe.id %}" 
               class="fw-bold recipe-link">
               {{ slot.recipe.title }}
            </a>

            <div class="mt-1 mb-2 btn-row">
                <a href="{% url 'meal-slot-update' slot.id %}"
                   class="btn btn-add btn-outline-primary">Edit</a>

                <a href="{% url 'meal-slot-clear' slot.id %}"
                   class="btn btn-sm btn-outline-danger ms-2">Clear</a>
            </div>
        </div>

    {% else %}
        <a href="{% url 'meal-slot-update' slot.id %}" 
           class="btn btn-sm btn-outline-primary">+ Add</a>
    {% endif %}
{% else %}
    <span class="text-danger">No slot found</span>
{% endif %}
