{% if slot.recipe %}
    <div class="d-flex align-items-center">
        {% if slot.recipe.image %}
            <img src="{{ slot.recipe.image.url }}"
                 class="meal-thumb me-2"
                 alt="{{ slot.recipe.title }}">
        {% endif %}

        <a href="{% url 'recipe_detail' slot.recipe.id %}" 
           class="recipe-link">
           {{ slot.recipe.title }}
        </a>
    </div>
{% else %}
    <span class="text-muted fst-italic">Not planned</span>
{% endif %}
