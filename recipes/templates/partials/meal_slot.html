{% if slot %}
    {% if slot.recipe %}
        <!-- Recipe name -->
        <div class="mb-2">
            <a href="{% url 'recipe_detail' slot.recipe.id %}" 
               class="text-decoration-none fw-bold text-primary">
                {{ slot.recipe.title }}
            </a>
        </div>

        <!-- Clear slot -->
        <a href="{% url 'meal-slot-clear' slot.id %}" 
           class="btn btn-sm btn-outline-danger me-2">
            🗑 Clear
        </a>

    {% else %}
        <!-- Empty slot -->
        <span class="empty-slot">
            <i class="bi bi-plus-circle"></i> Add recipe
        </span>
    {% endif %}

    <!-- Edit button -->
    <a href="{% url 'meal-slot-update' slot.id %}"
       class="btn btn-sm btn-outline-primary mt-1">
        ✏️ Edit
    </a>
{% else %}
    <span class="text-danger">No slot found</span>
{% endif %}
