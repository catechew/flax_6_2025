{% extends 'base/base_content.html' %}
{% block content %}

<section class="py-5 text-center" style="background: #F14F32; color: white;">
    <div class="container py-5">
        <h1 class="display-3 fw-bold mb-3">Recipify</h1>
        <p class="lead fw-bold mb-4">A recipe-sharing and meal-planning app made <i>for students, by students</i>.</p>

        <div class="d-flex justify-content-center gap-3">
            <a href="{% url 'sign_up' %}" class="btn btn-lg btn-light text-primary fw-bold px-4 py-2">
                Sign Up
            </a>
            <a href="{% url 'log_in' %}" class="btn btn-lg btn-light text-primary fw-bold px-4 py-2">
                Log In
            </a>
        </div>
    </div>
</section>

<section class="container py-4">
    <div class="row justify-content-center text-center">
        <div class="col-6 col-sm-4 col-md-2 mb-4">
            <i class="bi bi-plus-circle fs-1 text-primary"></i>
            <p>Create Recipes</p>
        </div>
        <div class="col-6 col-sm-4 col-md-2 mb-4">
            <i class="bi bi-star-fill fs-1 text-warning"></i>
            <p>Rate Recipes</p>
        </div>
        <div class="col-6 col-sm-4 col-md-2 mb-4">
            <i class="bi bi-heart fs-1 text-danger"></i>
            <p>Save Favourites</p>
        </div>
        <div class="col-6 col-sm-4 col-md-2 mb-4">
            <i class="bi bi-calendar-week fs-1 text-success"></i>
            <p>Plan Meals</p>
        </div>
        <div class="col-6 col-sm-4 col-md-2 mb-4">
            <i class="bi bi-people fs-1 text-info"></i>
            <p>Follow Others</p>
        </div>
    </div>
</section>

{% endblock %}
