{% extends 'base_content.html' %}

{% block content %}
<div class="container mt-4">
  <h2><i class="bi bi-bookmark-heart"></i> My Saved Recipes</h2>

  {% if recipes %}
    <div class="row mt-4">
      {% for recipe in recipes %}
        <div class="col-md-4 mb-4">
    {% include 'partials/recipe_card.html' with recipe=recipe show_save_button=True %}
</div>
      {% endfor %}
    </div>
  {% else %}
    <div class="alert alert-info mt-4">
      You haven't saved any recipes yet. <a href="{% url 'all_recipes' %}">Go explore!</a>
    </div>
  {% endif %}
</div>
{% endblock %}
