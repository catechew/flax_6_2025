{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-uWxY/CJNBR+1zjPWmfnSnVxwRheevXITnMqoEIeG1LJrdI0GlVs/9cVSyPYXdcSF"
          crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css">
    
    <link href="{% static 'custom.css' %}" rel="stylesheet">
    <link href="{% static 'layout.css' %}" rel="stylesheet">
    <link href="{% static 'buttons.css' %}" rel="stylesheet">
    <link href="{% static 'navbar.css' %}" rel="stylesheet">
    <link href="{% static 'recipes.css' %}" rel="stylesheet">
    <link href="{% static 'home.css' %}" rel="stylesheet">
    {% block extra_css %}{% endblock %}

    <title>Recipify</title>
</head>

<body>

    <!-- Navbar -->
    {% include "partials/navbar.html" %}
    
    <div class="content container mt-4">

        {% include "partials/messages.html" %}

        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"
            integrity="sha384-7+zCNj/IqJ95wo16oMtfsKbZ9ccEh31eOz1HGyDuCQ6wgnyJNSYdrPa03rtR1zdB"
            crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.2/dist/js/bootstrap.min.js"
            integrity="sha384-PsUw7Xwds7x08Ew3exXhqzbhuEYmA2xnwc8BuD6SEr+UmEHlX8/MCltYEodzWA4u"
            crossorigin="anonymous"></script>
    <script>

    // Allow users to open recipe details by clicking anywhere on the card
    document.addEventListener('DOMContentLoaded', function() {
        const cards = document.querySelectorAll('.clickable-card');

        cards.forEach(card => {
            card.style.cursor = 'pointer';

            card.addEventListener('click', function(e) {
                // Don't navigate if clicking on interactive elements (username)
                if (e.target.closest('.prevent-card-click')) {
                    return;
                }

                // Navigate to recipe detail
                const url = this.dataset.recipeUrl;
                window.location.href = url;
            });
        });
    });
    </script>
</body>
</html>
